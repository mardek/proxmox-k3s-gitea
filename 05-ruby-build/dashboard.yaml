apiVersion: v1
kind: Namespace
metadata:
  name: gentoo-ruby
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruby-dashboard-data
  namespace: gentoo-ruby
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruby-build-dashboard
  namespace: gentoo-ruby
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruby-build-dashboard
  template:
    metadata:
      labels:
        app: ruby-build-dashboard
    spec:
      containers:
        - name: dashboard
          image: python:3.13-alpine
          command: [python, /opt/ruby-build/dashboard.py]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: scripts
              mountPath: /opt/ruby-build
            - name: data
              mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: ruby-build-scripts
        - name: data
          persistentVolumeClaim:
            claimName: ruby-dashboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: ruby-build-dashboard
  namespace: gentoo-ruby
spec:
  type: NodePort
  selector:
    app: ruby-build-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
