# Longhorn values for k3s homelab
# Usage: helm install longhorn longhorn/longhorn -n longhorn-system -f k8s/longhorn-values.yaml

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  replicaSoftAntiAffinity: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

# Disable UI for headless environments (optional)
ui:
  enabled: true
