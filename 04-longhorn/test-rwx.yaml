apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-rwx-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-rwx
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-rwx-writer
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-1
  containers:
    - name: writer
      image: debian:12-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            date -u +"%Y-%m-%dT%H:%M:%SZ $(hostname)" >> /data/shared.log
            sleep 5
          done
      volumeMounts:
        - name: shared
          mountPath: /data
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: longhorn-rwx-test
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-rwx-reader
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-2
  containers:
    - name: reader
      image: debian:12-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in $(seq 1 60); do
            if [ -s /data/shared.log ]; then
              cat /data/shared.log
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for shared data" >&2
          exit 1
      volumeMounts:
        - name: shared
          mountPath: /data
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: longhorn-rwx-test
